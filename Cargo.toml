# The workspace: the two base libraries, and the repository's own package at the root, which publishes
# nothing and holds the checks that span both crates in `tests/`.
[workspace]
members = ["provider", "client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "chat-repository-checks"
description = "Checks that span both chat base libraries; never published."
version.workspace = true
edition.workspace = true
publish = false
