# The workspace: the two base libraries, the harness plugin, and the repository's own package at the root,
# which publishes nothing and holds the checks that span the crates in `tests/`.
[workspace]
members = ["provider", "client", "plugin", "console-face"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.10"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
headers = "0.4.1"
jsonschema = { version = "0.58.6", default-features = false }
mime_guess = "2.0.5"
multer = "3.1.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.0", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "chat-repository-checks"
description = "Checks that span the chat crates; never published."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
bmo-chat = { path = "provider" }
bmo-chat-client = { path = "client" }
bmo-chat-plugin = { path = "plugin" }
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
