# The workspace: the two base libraries, and the repository's own package at the root, which publishes
# nothing and holds the checks that span both crates in `tests/`.
[workspace]
members = ["provider", "client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
headers = "0.4.1"
jsonschema = { version = "0.58.6", default-features = false }
pulldown-cmark = { version = "0.13.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
strum = { version = "0.28.0", features = ["derive"] }
tokio = "1.53.2"
tower = { version = "0.5.2", features = ["util"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "chat-repository-checks"
description = "Checks that span both chat base libraries; never published."
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
bmo-chat = { path = "provider" }
bmo-chat-client = { path = "client" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
