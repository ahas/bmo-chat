[package]
name = "bmo-chain"
description = "A client of the account service's delegation chain: kinds declared, resolved for a person or a unit, and a link's entry read or written in a caller's name."
version.workspace = true
edition.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
reqwest.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
