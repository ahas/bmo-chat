# The registry crates every Rust unit takes at one version and one feature set, so that what one unit's
# build compiles into the shared build directory every other unit's build reuses, and the releases of each
# package a consumer may vendor as a packed file. The rule is docs/conventions.md, 「Shared versions」; the
# testbed's shared-versions quick check holds a unit to it.

# The line a unit writes for each listed crate, copied byte for byte into its [workspace.dependencies],
# or into its [dependencies] where it is one package. The features are the union of what the units need,
# sorted, the ones a test build alone uses included.
[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

# The version a unit's Cargo.lock resolves each registry crate to that the listed crates build on for
# x86_64-unknown-linux-gnu, the listed crates included, from one resolution of the lines above: one
